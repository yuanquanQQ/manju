[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel2anime"
version = "0.1.0"
description = "本地 AI 漫剧生成流水线"
readme = "readme.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.5,<3",
    "typer>=0.12,<1",
    "loguru>=0.7,<1",
    "SQLAlchemy>=2.0,<3",
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "PySide6>=6.8,<7",
    "paramiko>=3.5,<4",
    "edge-tts>=7.2,<8",
    "Pillow>=11,<13",
    "pypinyin>=0.53,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
novel2anime = "main:app"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "scripts/gpu/download_t5.py",
    "scripts/gpu/find_*.py",
    "scripts/gpu/get_t5.py",
    "scripts/gpu/list_*.py",
    "scripts/gpu/restore_krea_ms.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "app.domain.narrative",
    "app.evaluation.narrative_quality",
    "app.pipeline.story_bible",
    "app.pipeline.story_plan_store",
]
disallow_untyped_defs = true
